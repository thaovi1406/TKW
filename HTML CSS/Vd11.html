<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*1*/
        .row {
            display: flex;
            align-items: stretch;
            margin-bottom: 10px;
        }
        .label {
            flex: 0 0 auto;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .row .container {
            flex: 1;
            display: flex;
            justify-content: flex-start;
        }
        .row .dish {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tu {
            background-color: orange;
        }
        .tg {
            background-color: yellow;
        }
        .ti {
            background-color: rgb(224, 4, 224);
        }
        .te {
            background-color: skyblue;
        }

        /*2*/
        .row1 {
            display: flex;
            align-items: stretch;
            margin-bottom: 10px;
        }
        .label {
            flex: 0 0 auto;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .row1 .container {
            flex: 1;
            display: flex;
            justify-content: flex-start;
        }
        .row1 .dish {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tu {
            background-color: orange;
        }
        .tg {
            background-color: yellow;
        }
        .ti {
            background-color: rgb(224, 4, 224);
        }
        .te {
            background-color: skyblue;
        }

        /*3*/
        .row2 {
            display: flex;
            align-items: stretch;
        }
        .label {
            flex: 0 0 auto;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .row2 .container {
            flex: 1;
            display: flex;
            justify-content: flex-start;
        }
        .row2 .dish {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tu {
            background-color: orange;
        }
        .tg {
            background-color: yellow;
        }
        .ti {
            background-color: rgb(224, 4, 224);
        }
        .te {
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="container">
            <div class="dish tu" style="flex-basis: 30%;">30%</div>
            <div class="dish tg" style="flex-basis: 40%;">40%</div>
            <div class="dish ti" style="flex-basis: 20%;">20%</div>
            <div class="dish te" style="flex-basis: 10%;">10%</div>
        </div>
    </div>

    <div class="row1">
        <div class="container">
            <div class="dish tu" style="flex-basis: 45%;">45%</div>
            <div class="dish tg" style="flex-basis: 35%;">35%</div>
            <div class="dish ti" style="flex-basis: 10%;">10%</div>
            <div class="dish te" style="flex-basis: 10%;">10%</div>
        </div>
    </div>

    <div class="row2">
        <div class="container">
            <div class="dish tu" style="flex-basis: 35%;">35%</div>
            <div class="dish tg" style="flex-basis: 30%;">30%</div>
            <div class="dish ti" style="flex-basis: 25%;">25%</div>
            <div class="dish te" style="flex-basis: 10%;">10%</div>
        </div>
    </div>
</body>
</html>
