<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>32.1 slide 12</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body 
        {
            display: flex;
            justify-content: center;
            margin: 10px auto;
            padding: 15px;
            font-weight: bold;
            box-sizing: border-box;
        }
        form
        {
            border: 2px solid white;
            padding: 20px;
            width: 500px;
            box-sizing: border-box;
        }
        div
        {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        input
        {
            margin-top: 10px;
            width: 300px;
            margin-left: 10px;
            padding: 5px;
        }
        label 
        {
            width: 100px;
            margin-top: 10px;
            margin-right: 50px;
        }
        input[type=submit]
        {
            width: 70px;
            margin-left: 2px;
            margin-bottom: 5px;
        }
        @media screen and (max-width: 640px)
        {
            body
            { 
                width: 100%;
                background-color: rgba(2, 134, 90, 0.458);
                color: white;
            }
            form 
            {
                padding: 20px;
                box-sizing: border-box; /* Đảm bảo padding không làm tràn form */
                max-width: 100%;
            }
            div
            {
                display: flex;
                flex-wrap: wrap; /* Cho phép các phần tử trong div co dãn */
                width: 100%; /* Đảm bảo div con chiếm 100% */
            }
            input 
            {
                width: 100%; /* Input chiếm 100% chiều rộng khi màn hình nhỏ */
                margin: 5px 0; /* Điều chỉnh margin giữa các input */
                min-width: unset; /* Bỏ giới hạn chiều rộng tối thiểu */
                box-sizing: border-box;
            }
        }
        @media (min-width:768px)
        {
            body 
            {
                background-color: purple;
                color: white;
            }
        }
        @media (min-width:1024px)
        {
            body 
            {
                background-color:blue;
                color: white;
            }
        }
    </style>
</head>
<body>
    <div>
        <form action="1.html">
            <div>
                <label for="hoten">Họ tên</label>
                <input type="text" name="hoten">
            </div>
            <div>
                <label for="ngaysinh">Ngày sinh</label>
                <input type="date" name="ngaysinh">

            </div>
            <div>
                <label for="email">Email</label>
            <input type="email" name="email">
            </div>
            <div>
                <label for="sdt">SĐT</label>
            <input type="tel" name="sdt">
            </div>
            <input type="submit" value="Đăng ký" id="submit">
        </form>
    </div>
</body>
</html>
