<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div {
            font-weight: bold;
        }
        header {
            background-color: rgba(255, 0, 0, 0.797);
            text-align: center;
            padding: 5px;
        }
        footer {
            background-color: rgba(27, 221, 156, 0.682);
            text-align: center;
            padding: 5px;
        }
        .cum {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap; /* Cho phép bọc các phần tử */
        }
        .aside1 {
            background-color: yellow;
            text-align: center;
            padding: 5px;
        }
        .aside2{
            background-color: pink;
            text-align: center;
            padding: 5px;
        }
        .main {
            background-color: rgba(0, 187, 255, 0.695);
            text-align: center;
            padding: 5px;
        }
        
        @media screen and (min-width: 1024px) {
            .cum {
                flex-direction: row; /* Hướng hàng cho màn hình lớn */
            }
            .aside1 {
                flex: 1;
                order: 1; 
            }
            .main {
                flex: 2;
                order: 2; 
                padding: 20px;
            }
            .aside2 {
                flex: 1;
                order: 3; 
            }
        }

        @media screen and (min-width: 768px) and (max-width: 1024px) {
            .cum {
                flex-direction: row; /* Để các phần tử nằm ngang */
                justify-content: space-between; /* Giãn cách đều */
            }
            .main {
                order: 1;
                flex-grow: 2; /* Nội dung chính chiếm nhiều diện tích hơn */
                display: flex;
                align-items: center; /* Canh giữa nội dung */
                justify-content: center; /* Canh giữa nội dung */
                width: 100%; /* Chiếm toàn bộ chiều rộng */
                padding: 20px;
            }
            .aside1 {
                order: 2; /* Đặt aside 1 dưới nội dung chính */
                flex-grow: 1; /* Chiếm ít diện tích hơn */
                display: flex;
                align-items: center; /* Canh giữa nội dung */
                justify-content: center; /* Canh giữa nội dung */
            }
            .aside2 {
                order: 3; /* Đặt aside 2 dưới nội dung chính */
                flex-grow: 1; /* Chiếm ít diện tích hơn */
                display: flex;
                align-items: center; /* Canh giữa nội dung */
                justify-content: center; /* Canh giữa nội dung */
            }
        }

        @media screen and (max-width: 768px) {
            .cum {
                flex-direction: column; /* Hướng cột cho màn hình nhỏ */
            }
            .main
            {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>Header</header>
    <div class="cum">
        <main class="main">Main Content</main>
        <aside class="aside1">Aside 1</aside>
        <aside class="aside2">Aside 2</aside>
    </div>
    <footer>Footer</footer>
    
</body>
</html>
