<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-4</title>
    <style>
        div {
            font-weight: bold;
        }
        .one {
            background-color: red;
            text-align: center;
        }
        .two {
            background-color: rgb(27, 221, 156);
            text-align: center;
        }
        .three {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap; /* Cho phép bọc các phần tử */
        }
        .three1 {
            background-color: yellow;
            text-align: center;
        }
        .three2 {
            background-color: blue;
            text-align: center;
        }
        .three3 {
            background-color: rgb(233, 131, 148);
            text-align: center;
        }
        
        @media screen and (min-width: 1024px) {
            .three {
                flex-direction: row; /* Hướng hàng cho màn hình lớn */
            }
            .three1 {
                flex: 1;
                order: 1; 
            }
            .three2 {
                flex: 2;
                order: 2; 
            }
            .three3 {
                flex: 1;
                order: 3; 
            }
        }

        @media screen and (min-width: 768px) and (max-width: 1024px) {
            .three {
                flex-direction: row; /* Để các phần tử nằm ngang */
                justify-content: space-between; /* Giãn cách đều */
            }
            .three2 {
                order: 1;
                flex-grow: 2; /* Nội dung chính chiếm nhiều diện tích hơn */
                display: flex;
                align-items: center; /* Canh giữa nội dung */
                justify-content: center; /* Canh giữa nội dung */
                width: 100%; /* Chiếm toàn bộ chiều rộng */
            }
            .three1 {
                order: 2; /* Đặt aside 1 dưới nội dung chính */
                flex-grow: 1; /* Chiếm ít diện tích hơn */
                display: flex;
                align-items: center; /* Canh giữa nội dung */
                justify-content: center; /* Canh giữa nội dung */
            }
            .three3 {
                order: 3; /* Đặt aside 2 dưới nội dung chính */
                flex-grow: 1; /* Chiếm ít diện tích hơn */
                display: flex;
                align-items: center; /* Canh giữa nội dung */
                justify-content: center; /* Canh giữa nội dung */
            }
        }

        @media screen and (max-width: 768px) {
            .three {
                flex-direction: column; /* Hướng cột cho màn hình nhỏ */
            }
        }
    </style>
</head>
<body>
    <div class="one">Header</div>
    <div class="three">
        <div class="three2">Main Content</div>
        <div class="three1">Aside 1</div>
        <div class="three3">Aside 2</div>
    </div>
    <div class="two">Footer</div>
</body>
</html>
