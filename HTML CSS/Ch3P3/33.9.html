<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .gioithieu
        {
            background-color: rgba(55, 55, 66, 0.938);
            text-align: center;
            color: white;
            padding: 30px;
            align-content: center;
        }
        img
        {
            width: 100%;
            height: 120px;
            border-radius: inherit;
        }
        .main1
        {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            width: 100%;
        }
        .one, .two, .three, .four, .five, .six, .seven, .eight
        {
            display: flex;
            flex-direction: column;
            margin: 20px;
            text-align: center;
            border: 1px solid rgba(128, 128, 128, 0.404);
            min-height: 200px;
            padding-bottom: 20px;
            gap: 10px;
            border-radius: 2%;
        }
        .nut
        {
            margin-top: auto;
        }
        button
        {
            background-color: white;
            border: 1px solid gray;
            border-radius: 5px;
            padding: 7px;
        }
        .star
        {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 2px;
            margin: 5px 0;
            color: gold;
            font-size: x-small;
        }
        del
        {
            color: rgba(128, 128, 128, 0.663);
        }
        .sale-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: black;
            color: white;
            padding: 4px 7px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
        }
        .main1 > div {
            position: relative; /* Để nhãn "Sale" có thể định vị dựa trên khối chứa */
        }        
        @media (max-width:768px)
        {
            .main1
            {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="gioithieu">
        <h1>Shop in style</h1>
        <div>With this shop hompeage template</div>
    </div>
        <div class="main1">
            <div class="one">
                <img src="../image/6c757d.jpg" alt="">
                <div>Fancy Product</div>
                <div>$40.00 - $80.00</div>
                <div class="nut">
                    <button>View options</button>
                </div>

            </div>
            <div class="two">
                <div class="sale-badge">Sale</div>
                <img src="../image/6c757d.jpg" alt="">
                <div>Special Item</div>
                <div class="star">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div><del>$20.00</del> $18.00</div>
                <div class="nut">
                    <button>Add to cart</button>
                </div>
            </div>
            <div class="three">
                <div class="sale-badge">Sale</div>
                <img src="../image/6c757d.jpg" alt="">
                <div>Sale Item</div>
                <div><del>$50.00</del> $25.00</div>
                <div class="nut">
                    <button>Add to cart</button>
                </div>
            </div>
            <div class="four">
                <img src="../image/6c757d.jpg" alt="">
                <div>Popular Item</div>
                <div class="star">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div>$40.00</div>
                <div class="nut">
                    <button>Add to cart</button>
                </div>
            </div>
            <div class="five">
                <div class="sale-badge">Sale</div>
                <img src="../image/6c757d.jpg" alt="">
                <div>Sale Item</div>
                <div><del>$50.00</del> $25.00</div>
                <div class="nut">
                    <button>Add to cart</button>
                </div>
            </div>
            <div class="six">
                <img src="../image/6c757d.jpg" alt="">
                <div>Fancy Product</div>
                <div>$120.00 - $280.00</div>
                <div class="nut">
                    <button>View options</button>
                </div>
            </div>
            <div class="seven">
                <div class="sale-badge">Sale</div>
                <img src="../image/6c757d.jpg" alt="">
                <div>Special Item</div>
                <div class="star">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div><del>$20.00</del> $18.00</div>
                <div class="nut">
                    <button>Add to cart</button>
                </div>
            </div>
            <div class="eight">
                <img src="../image/6c757d.jpg" alt="">
                <div>Popular Item</div>
                <div class="star">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
                <div>$40.00</div>
                <div class="nut">
                    <button>Add to cart</button>
                </div>
            </div>
        </div>
</body>
</html>
