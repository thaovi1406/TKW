<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .grid
        {
            display: grid;
            background-color: coral;
            gap: 10px;
            padding: 10px;
        }
        .item
        {
            background-color: antiquewhite;
            text-align: center;
            padding: 20px;
            font-size: 16pt;
            font-weight: bold;
        }
        @media (max-width:640px)
        {
            .grid
            {
                grid-template-columns: 1ft;
            }
        }
        @media (min-width:768px)
        {
            .grid
            {
                grid-template-columns: 1ft 1ft;
                grid-template-rows: 1ft 1ft 1ft 1ft;
            }
            .header 
            {
                grid-column: 1/3;
                grid-row: 1/2;
            }
            .menu
            {
                grid-column: 1/3;
                grid-row: 2/3;            
            }
            .main
            {
                grid-column: 1/2;
                grid-row: 3/4;
            }
            .footer
            {
                grid-column: 1/3;
                grid-row: 4/5;
            }
        }
        @media (min-width:1024px)
        {
            .grid
            {
                grid-template-columns: 1ft 1ft 1ft;
                grid-template-rows: 1ft 1ft 1ft;
            }
            .header 
            {
                grid-column: 1/4;
                grid-row: 1/2;
            }
            .menu
            {
                grid-column: 1/2;
                grid-row: 2/4;
            }
            .main
            {
                grid-column: 2/3;
                grid-row: 2/3;
            }
            .footer
            {
                grid-column: 2/4;
                grid-row: 3/4;
            }
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="item header">Header</div>
        <div class="item menu">Menu</div>
        <div class="item main">Main</div>
        <div class="item right">Right</div>
        <div class="item footer">Footer</div>
    </div>
</body>
</html>
