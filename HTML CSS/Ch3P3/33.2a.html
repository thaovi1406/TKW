<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .grid
        {
            display: grid;
            width: 400px;
            height: 250px;
            grid-gap: 5px 5px ;
            grid-template-areas: 
                    'item1 item1 item2'
                    'item3 item4 item4'
                    'item3 item5 item6'
            ;
            text-align: center;
        }
        .item1
        {
            background-color: aqua;
            align-content: center;
            grid-area: item1;
        }
        .item2
        {
            background-color: bisque;
            align-content: center;
            grid-area: item2;
        }
        .item3
        {
            background-color: blue;
            align-content: center;
            grid-area: item3;
        }
        .item4
        {
            background-color: pink;
            align-content: center;
            grid-area: item4;
        }
        .item5
        {
            background-color: cadetblue;
            align-content: center;
            grid-area: item5;
        }
        .item6
        {
            background-color: orange;
            align-content: center;
            grid-area: item6;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
    </div>
</body>
</html>
