<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .box1, .box2, .box3
        {
            display: flex;
            margin: 10px;
        }
        .a
        {
            background-color: red;
        }
        .b
        {
            background-color: aqua;
        }
        .c
        {
            background-color: bisque;
        }
        .d
        {
            background-color: rgba(255, 0, 212, 0.23);
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="a" style="flex-basis: 30%;">30%</div>
        <div class="b" style="flex-basis: 40%;">40%</div>
        <div class="c" style="flex-basis: 20%;">20%</div>
        <div class="d" style="flex-basis: 10%;">10%</div>
    </div>

    <div class="box2">
        <div class="a" style="flex-basis: 45%;">45%</div>
        <div class="b" style="flex-basis: 35%;">35%</div>
        <div class="c" style="flex-basis: 10%;">10%</div>
        <div class="d" style="flex-basis: 10%;">10%</div>
    </div>

    <div class="box2">
        <div class="a" style="flex-basis: 35%;">35%</div>
        <div class="b" style="flex-basis: 30%;">30%</div>
        <div class="c" style="flex-basis: 25%;">25%</div>
        <div class="d" style="flex-basis: 10%;">10%</div>
    </div>
</body>
</html>
