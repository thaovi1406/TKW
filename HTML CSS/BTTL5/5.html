<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .hop 
        {
            display: flex;
            flex-direction: row;
        }
        .hop1, .hop2, .hop4, .hop5
        {
            background-color: rgba(0, 255, 255, 0.559);
            flex: 1;
            align-content: center;
            padding: 20px;
        }
        .hop3
        {
            background-color: rgba(255, 166, 0, 0.573);
            flex: 3;
            align-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="hop">
        <div class="hop1">Hộp 1</div>
        <div class="hop2">Hộp 2</div>
        <div class="hop3">Hộp 3 (Trung tâm)</div>
        <div class="hop4">Hộp 4</div>
        <div class="hop5">Hộp 5</div>
    </div>
</body>
</html>
