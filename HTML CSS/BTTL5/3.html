<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .hop
        {
            display: flex;
            height: 100px;
        }
        .hop1, .hop2, .hop3, .hop4
        {
            margin: 10px;
            background-color: pink; 
            align-content: center;
            padding-left: 20px;
        }
        .hop1
        {
            flex:2;
        }
        .hop2
        {
            flex: 1;
        }
        .hop3
        {
            flex: 1;
        }
        .hop4
        {
            flex: 2;
        }
    </style>
</head>
<body>
    <div class="hop">
        <div class="hop1">Hộp 1</div>
        <div class="hop2">Hộp 2</div>
        <div class="hop3">Hộp 3</div>
        <div class="hop4">Hộp 4</div>
    </div>
</body>
</html>
