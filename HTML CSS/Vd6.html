<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                font-family: sans-serif;
            }
            .container {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 100px;
            }
            .item {
                width: 325px;
                overflow: visible;
                margin: 20px;
            }
            .item img {
                width: 100%;
                height: auto;
            }
            .content {
                padding: 16px;
                font-weight:lighter;
            }
            .content p {
                padding-bottom: 10px;
            }
            .content .mau {
                font-weight: bold;
            }
            .content .ke {
                text-decoration-line: line-through;
                color: grey;
            }
            .content .do {
                color: red;
                font-weight: bold;
            }
            
        </style>
    </head>
    <body>
        <div class=container>
            <div class=item>
                <img src="./image/aiphon.jpg">
                <div class = content>
                    <p>Điện Thoại iPhone 6 32GB VN/A (Vàng Đồng - Hàng Chính Hãng)</p>
                    <span class=mau>6.199.000 đ </span>
                    <span class=ke>8.990.000 đ</span>
                    <span class=do>-31%</span>
                </div>
            </div>

            <div class=item>
                <img src="./image/xiaomi.jpg">
                <div class = content>
                    <p>Điện Thoại Samsung Galaxy J2 Pro 2018 - Hàng Chính Hãng</p>
                    <span class=mau>2.360.000 đ </span>
                    <span class=ke>3.290.000 đ</span>
                    <span class=do>-28%</span>
                </div>
            </div>

            <div class=item>
                <img src="./image/aiphon.jpg">
                <div class = content>
                    <p>Điện Thoại Xiaomi Mi Mix 2 (Black) - Hàng Chính Hãng</p>
                    <span class=mau>7.290.000 đ </span>
                    <span class=ke>12.990.000 đ</span>
                    <span class=do>-44%</span>
                </div>
            </div>
        </div>
    </body>
</html>
