<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culinary Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header */
        .header {
            background-color: #001f3f;
            padding: 10px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: white;
        }

        .header a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .header a:hover {
            text-decoration: underline;
        }

        /* Search Bar */
        .search-bar {
            margin: 20px auto;
            text-align: center;
        }

        .search-bar input[type="text"] {
            width: 250px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .search-bar button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #001f3f;
            color: white;
            cursor: pointer;
            margin-left: 10px;
        }

        /* Food Gallery */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
        }

        .gallery-item {
            flex: 1 1 30%;
            margin: 10px;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        /* Footer */
        .footer {
            background-color: #001f3f;
            padding: 10px;
            color: white;
            text-align: center;
        }

        @media screen and (max-width: 768px) {
            .gallery-item {
                flex: 1 1 45%; /* Chỉnh lại kích thước trên màn hình nhỏ */
            }
        }

        @media screen and (max-width: 576px) {
            .gallery-item {
                flex: 1 1 100%; /* Chỉnh lại kích thước trên màn hình nhỏ hơn */
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="#">Home</a>
        <a href="#">Culinary Blog</a>
        <a href="#">Menu</a>
        <a href="#">Contact Us</a>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
        <input type="text" placeholder="Enter text here...">
        <button>Search</button>
    </div>

    <!-- Food Gallery -->
    <div class="gallery">
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300" alt="Food 1">
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300" alt="Food 2">
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300" alt="Food 3">
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300" alt="Food 4">
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300" alt="Food 5">
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300" alt="Food 6">
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2024 Culinary Website. All Rights Reserved.
    </div>

</body>
</html>
