<!DOCTYPE html>
<html>
    <head>

            p {

            }
            #b1 { 
                color: red;
            }
            #span2 {
                color: rgb(78, 178, 235);
                font-style: italic;
            }
            #b2 {
                color: rgb(127, 11, 127);
            }
        </style>

        <p>
            Khát vọng của chúng tôi là trở thành <b id="b1">đại học nghiên cứu hàng đầu Việt Nam</b></span>, đóng <span id="span2">góp tích cực</span> vào <b id="b2"><u>sự thịnh vượng của cộng đồng ASEAN và tri thức nhân loại</u></b>.
        </p>
    </body>
</html>
