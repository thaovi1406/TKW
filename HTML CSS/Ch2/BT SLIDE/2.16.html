<!DOCTYPE html>
<html>
    <head><title>2.16 slide 82</title></head>
    <body>
        <form action="mango" method="post">
            <table>
                <div>
                    <img src="images/mango.jpg" alt="" style="width:300px;">
                </div>
                <tr>
                    <td style="width:120px">Email Address </td>
                    <td>
                        <input type="email" name="email" required>
                    </td>
                </tr>
                <tr>
                    <td style="width:120px">Date of Booking</td>
                    <td >
                         <input type="date" name="date of booking">
                    </td>
                </tr>
                <tr>
                    <td style="width:120px">Number of people</td>
                    <td>
                         <input type="number" name="number of people" min="1" max="8">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                       <input type="checkbox" name="checkbox" required> 
                       I agree to the cancellation policy 
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Book Now">
                    </td>
                </tr>
            </table>      
        </form>
        
    </body>
</html>
