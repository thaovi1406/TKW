<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h2>Kiểm tra JavaScript nhúng</h2>
    <p id="change">Hãy thay đổi nội dung</p>
    <script>
        document.getElementById("change").innerHTML = "Nội dung này đã được thay đổi bởi JavaScript!";
        document.getElementById("change").style.border="1px solid red"
        document.getElementById("change").style.width="300px"
    </script>
</body>
</html>
