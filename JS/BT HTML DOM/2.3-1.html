<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #name {
            margin:10px;
        }
        #gioitinh {
            margin: 15px;
        }
        #birthday {
            margin: 10px;
        }
        label {
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <label for="name">Họ và tên</label>
    <input type="text" name="name" id="name" onkeydown="document.getElementById('a').innerHTML = document.getElementById('name').value">
    <span>Họ và tên: <span id="a"></span></span> <br>

    <label for="birthday">Ngày sinh</label>
    <input type="text" name="birthday" id="birthday" onkeydown="document.getElementById('b').innerHTML = document.getElementById('birthday').value"> 
    <span>Ngày sinh: <span id="b"></span></span><br>

    <label for="gioitinh">Giới tính</label>
    <input type="text" name="gioitinh" id="gioitinh" onkeydown="document.getElementById('c').innerHTML = document.getElementById('gioitinh').value">
    <span>Giới tính: <span id="c"></span></span>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
