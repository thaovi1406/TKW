<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <p>Họ tên: <span id="hoten">N/A</span></p>
    <p>Ngày sinh: <span id="ngaysinh">N/A</span></p>
    <button type="button" onclick="showTen()">Họ tên</button>
    <button type="button" onclick="showNgay()">Ngày sinh</button>
    <script>
        function showTen() {
            document.getElementById('hoten').innerText='Maika';
        }
        function showNgay() {
            document.getElementById('ngaysinh').innerText='1/1/1111';
        }
    </script>
</body>
</html>
