<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thay Đổi Màu Nền Trang</title>
    <link rel="StyleSheet" href="./css/cau2a.css" />
    <script src="./js/cau2a.js"></script>
</head>

<body>
    <h1>Thay Đổi Màu Nền Trang</h1>
    <h2 class="thongbao"></h2>
    <button onclick="changeBackgroundColor('red')">Đỏ</button>
    <button onclick="changeBackgroundColor('green')">Xanh lá</button>
    <button onclick="changeBackgroundColor('blue')">Xanh dương</button>
    <button onclick="changeBackgroundColor('yellow')">Vàng</button>
    <button onclick="changeBackgroundColor('purple')">Tím</button>

    <br />
    <button onclick="resetBackgroundColor()">Đặt lại</button>
    <script>
        function changeBackgroundColor(doi) {
            document.body.style.backgroundColor=doi;   
            document.querySelector('.thongbao').textContent = `Màu nền trang đã được đổi thành ${doi}`;
        
        }
        function resetBackgroundColor() {
            document.body.style.backgroundColor='white';
        }
        
        
        
    </script>
</body>

</html>
